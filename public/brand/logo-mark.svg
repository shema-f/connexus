<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Connexus logo mark">
  <defs>
    <linearGradient id="cx-ring" x1="26" y1="14" x2="76" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5bdaf8"/>
      <stop offset="0.45" stop-color="#1c7ff2"/>
      <stop offset="1" stop-color="#0b4b99"/>
    </linearGradient>
    <linearGradient id="cx-link" x1="30" y1="38" x2="72" y2="62" gradientUnits="userSpaceOnUse">
